<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ویراستار هوشمند کتاب؛ دستیار ویراستاری، یکدست‌سازی و صفحه‌آرایی کتاب‌های فارسی." />
    <meta name="theme-color" content="#37231d" />
    <script>
      (() => {
        const savedTheme = localStorage.getItem("book-editor-theme");
        const prefersDark = matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", savedTheme === "dark" || (!savedTheme && prefersDark));
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ویراستار هوشمند کتاب | دستیار صنعت نشر فارسی</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
